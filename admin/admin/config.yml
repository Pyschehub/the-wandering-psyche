backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "essays"
    label: "Essays"
    folder: "essays-content"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["Psychology & Behavior", "Society & Culture", "Creative Psychology", "Motivation", "Relationships", "Cognitive Biases", "Identity", "Emotion", "Social Psychology"]}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "References (APA)", name: "references", widget: "text", required: false}

  - name: "book-reviews"
    label: "Book Reviews"
    folder: "book-reviews-content"
    create: true
    fields:
      - {label: "Book Title", name: "title", widget: "string"}
      - {label: "Book Author", name: "book_author", widget: "string"}
      - {label: "Review Author", name: "review_author", widget: "string"}
      - {label: "Rating", name: "rating", widget: "select", options: ["★★★★★", "★★★★☆", "★★★☆☆", "★★☆☆☆", "★☆☆☆☆"]}
      - {label: "Summary", name: "summary", widget: "text"}
      - {label: "Psychological Themes", name: "themes", widget: "string"}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Full Review", name: "body", widget: "markdown"}

  - name: "research"
    label: "Research Projects"
    folder: "research-content"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Research Question", name: "question", widget: "text"}
      - {label: "Background", name: "background", widget: "markdown"}
      - {label: "Methodology", name: "methodology", widget: "markdown"}
      - {label: "Results", name: "results", widget: "markdown"}
      - {label: "Discussion", name: "discussion", widget: "markdown"}
      - {label: "Limitations", name: "limitations", widget: "markdown"}
      - {label: "References", name: "references", widget: "text"}

  - name: "dear-mind"
    label: "Dear Mind Responses"
    folder: "dear-mind-content"
    create: true
    fields:
      - {label: "Anonymous Question", name: "question", widget: "text"}
      - {label: "Category", name: "category", widget: "select", options: ["Identity", "Relationships", "Motivation", "Academic Pressure", "Self-Perception", "Modern Life", "Future Anxiety"]}
      - {label: "Psychological Interpretation", name: "interpretation", widget: "markdown"}
      - {label: "Reflection", name: "reflection", widget: "markdown"}
      - {label: "References", name: "references", widget: "text"}
