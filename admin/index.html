<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <script src="https://unpkg.com/netlify-cms@2.10.192/dist/netlify-cms.js"></script>
</head>
<body>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "git-gateway",
          branch: "main"
        },
        media_folder: "images/uploads",
        public_folder: "/images/uploads",
        collections: [
          {
            name: "essays",
            label: "Essays",
            folder: "content/essays",
            create: true,
            slug: "{{slug}}",
            fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Author", name: "author", widget: "string" },
              { label: "Date", name: "date", widget: "datetime" },
              { label: "Category", name: "category", widget: "select", options: ["Psychology & Behavior", "Society & Culture", "Creative Psychology", "Motivation", "Relationships", "Cognitive Biases"] },
              { label: "Body", name: "body", widget: "markdown" }
            ]
          },
          {
            name: "book-reviews",
            label: "Book Reviews",
            folder: "content/book-reviews",
            create: true,
            slug: "{{slug}}",
            fields: [
              { label: "Book Title", name: "title", widget: "string" },
              { label: "Book Author", name: "book_author", widget: "string" },
              { label: "Rating", name: "rating", widget: "select", options: ["★★★★★", "★★★★☆", "★★★☆☆", "★★☆☆☆", "★☆☆☆☆"] },
              { label: "Summary", name: "summary", widget: "text" },
              { label: "Full Review", name: "body", widget: "markdown" }
            ]
          },
          {
            name: "research",
            label: "Research",
            folder: "content/research",
            create: true,
            slug: "{{slug}}",
            fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Research Question", name: "question", widget: "text" },
              { label: "Methodology", name: "methodology", widget: "markdown" },
              { label: "Body", name: "body", widget: "markdown" }
            ]
          },
          {
            name: "dear-mind",
            label: "Dear Mind",
            folder: "content/dear-mind",
            create: true,
            slug: "{{slug}}",
            fields: [
              { label: "Question", name: "question", widget: "text" },
              { label: "Category", name: "category", widget: "select", options: ["Identity", "Relationships", "Motivation", "Academic Pressure", "Self-Perception", "Modern Life", "Future Anxiety"] },
              { label: "Response", name: "body", widget: "markdown" }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
